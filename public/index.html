    <style id="critical-css">
      :root {
        --color-matte: #0a0a0a;
        --color-text: #f5f5f5;
        --color-muted: #9a9a9a;
        --color-electric: #00c2ff;
        --color-neon: #4debff;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display: Georgia, "Times New Roman", serif;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2.5rem;
        --space-xl: 4rem;
        --max-width: 1120px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-matte);
        color: var(--color-text);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      .app {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--color-matte);
        color: var(--color-text);
      }
      .navbar--home {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 50;
        padding: 1rem var(--space-md) 0;
      }
      .navbar__inner {
        max-width: var(--max-width);
        margin: 0 auto;
      }
      .navbar__shell {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .hero {
        position: relative;
        overflow: hidden;
        padding: clamp(7.5rem, 13vw, 9.5rem) var(--space-md) var(--space-xl);
        background: var(--color-matte);
        min-height: min(92vh, 920px);
      }
      .hero__inner {
        position: relative;
        max-width: var(--max-width);
        margin: 0 auto;
        z-index: 1;
      }
      .hero__eyebrow {
        margin: 0 0 var(--space-sm);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--color-electric);
        font-weight: 600;
      }
      .hero__title,
      #hero-heading {
        margin: 0 0 var(--space-md);
        font-size: clamp(2.35rem, 5.2vw, 3.65rem);
        line-height: 1.04;
        font-weight: 600;
        max-width: 14ch;
        min-height: 2.15em;
        color: var(--color-text);
      }
      .hero__title-accent {
        font-family: var(--font-display);
        font-style: italic;
        color: var(--color-neon);
      }
      .hero__lede {
        margin: 0 0 var(--space-lg);
        max-width: 36rem;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--color-muted);
      }
      .hero__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.82rem 1.45rem;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
      .hero__btn--primary {
        background: linear-gradient(135deg, var(--color-electric), #0099cc);
        color: var(--color-matte);
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("fonts-loading");
        var href =
          "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Michroma&display=optional";
        function loadFonts() {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          link.media = "print";
          link.onload = function () {
            link.media = "all";
            root.classList.remove("fonts-loading");
            root.classList.add("fonts-loaded");
          };
          document.head.appendChild(link);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadFonts, { timeout: 1500 });
        } else {
          window.addEventListener("load", loadFonts, { once: true });
        }
      })();
    </script>
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Michroma&display=optional"
        rel="stylesheet"
      />
    </noscript>

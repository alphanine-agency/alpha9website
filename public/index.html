<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="AlphaNineMarketing — premium digital marketing, AI automation, ads, content, and web design for brands that want to scale."
    />
    <!-- LCP: navbar logo is discoverable in HTML before JS -->
    <link
      rel="preload"
      href="%PUBLIC_URL%/logo-nav.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <!-- Fonts load after first paint (removes render-blocking + 3rd-party from critical path) -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("fonts-loading");
        var href =
          "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Michroma&display=swap";
        function loadFonts() {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          link.media = "print";
          link.onload = function () {
            link.media = "all";
            root.classList.remove("fonts-loading");
            root.classList.add("fonts-loaded");
          };
          document.head.appendChild(link);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadFonts, { timeout: 2800 });
        } else {
          window.addEventListener("load", loadFonts, { once: true });
        }
      })();
    </script>
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Michroma&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- SEO meta title suggestions (swap per route in React or use react-helmet in production):
         - Home: "AlphaNineMarketing | AI-Powered Digital Marketing Agency"
         - Services: "Services | Ads, AI, Content & Web | AlphaNineMarketing"
         - About: "About Us | Mission & Vision | AlphaNineMarketing"
         - Team: "Team | AlphaNineMarketing"
         - Contact: "Contact | AlphaNineMarketing" -->
    <title>AlphaNineMarketing | Premium Digital Marketing Agency</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
